# Релиз: `git tag v0.1.0 && git push origin v0.1.0` → готовые файлы для Windows,
# Linux и macOS + SHA256SUMS в ЧЕРНОВИКЕ GitHub Release. Опубликовать черновик —
# вручную, после проверки. Только first-party actions и встроенный `gh`.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Rust ${{ env.RUST_TOOLCHAIN }} + ${{ matrix.target }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: test
        # Кросс-сборку x86_64 на arm64-маке не запустить — тестируем только родную.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --release --target ${{ matrix.target }}
      - name: build
        shell: bash
        run: |
          # Пути раннера не должны попасть в бинарник.
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME=~"
          cargo build --locked --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="jetscan-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE NOTICE "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/jetscan.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/jetscan" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "jetscan $GITHUB_REF_NAME" \
            --notes "Download the archive for your system, check it against SHA256SUMS, put jetscan on your PATH."
