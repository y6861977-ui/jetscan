plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.insecure'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.insecure"
        minSdkVersion 21
        targetSdkVersion 30
        buildConfigField "String", "PAYMENTS_KEY", "\"@@STRIPE_SECRET@@\""
        manifestPlaceholders = [cleartext: "true"]
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword '@@PASSWORD@@'
            keyAlias 'upload'
            keyPassword "@@PASSWORD2@@"
        }
        debug {
            storePassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.release
        }
    }
}
