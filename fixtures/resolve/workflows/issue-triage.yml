name: Issue triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Log the issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: echo "New issue $ISSUE_NUMBER - ${{ github.event.issue.title }}"
        shell: bash
      - name: Pick a label
        run: |
          case "${{ github.event.issue.body }}" in
            *crash*) echo "label: bug" ;;
            *) echo "label: triage" ;;
          esac
